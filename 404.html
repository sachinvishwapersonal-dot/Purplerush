<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BlooRush — Page Not Found</title>
  <link rel="stylesheet" href="styles.css" />
  <script>
    const path = window.location.pathname;
    if (path.includes('/book') || path.includes('/customer')) {
      window.location.replace('customer.html');
    } else if (path.includes('/partner')) {
      window.location.replace('partner.html');
    } else if (path.includes('/admin') || path.includes('/ops')) {
      window.location.replace('admin.html');
    } else if (path.includes('/track')) {
      window.location.replace('track.html');
    }
  </script>
</head>
<body>
  <div class="container" style="justify-content:center;text-align:center;padding:40px 20px;">
    <div style="font-size:48px;margin-bottom:12px;">🧹</div>
    <h1>Page Not Found</h1>
    <p class="sub">The requested page could not be found.</p>
    <a href="index.html" class="btn" style="width:auto;margin:0 auto;">Return to Home</a>
  </div>
</body>
</html>
